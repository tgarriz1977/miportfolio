services:
  portfolio:
    build: .
    container_name: portfolio-dashboard
    ports:
      - "5050:5050"
    volumes:
      - ./data:/data
    restart: unless-stopped
    environment:
      - PORTFOLIO_DB=/data/portfolio.db
      - HOST=0.0.0.0
      - PORT=5050
      # Módulo de análisis. Se configura en .env (ver .env.example), que está
      # fuera de git para que la API key no termine en el repositorio.
      # Vacías = análisis deshabilitado; el panel igual muestra noticias y
      # balances, solo queda sin el resumen redactado.
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - INSIGHT_TTL_HOURS=${INSIGHT_TTL_HOURS:-6}
      # Videos del panel de análisis. Sin YOUTUBE_API_KEY la sección avisa
      # que falta configurarla y el resto del panel no cambia.
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - YOUTUBE_CHANNELS=${YOUTUBE_CHANNELS:-}
      - YOUTUBE_MAX_RESULTS=${YOUTUBE_MAX_RESULTS:-5}
      - YOUTUBE_DAYS=${YOUTUBE_DAYS:-30}
